# cc-memory workspace registry (managed by `memory workspace …`).
# Paths may use ~; they are expanded at load time. One block per workspace.

[[workspace]]
id = "acme"
match = ["~/code/acme"]
kb = "~/Documents/Acme Vault"
worklogs = "~/Documents/Acme Vault/_Worklogs"
exclude = ["_Worklogs", "Archive", ".obsidian"]
index_db = "~/.claude/memory/acme/index.db"

[[workspace]]
id = "homeserver"
match = ["~/homeserver", "~/Desktop/homeserver"]
kb = "~/Documents/Homeserver Vault"
worklogs = "~/Documents/Homeserver Vault/_Worklogs"
exclude = ["_Worklogs", ".obsidian"]
index_db = "~/.claude/memory/homeserver/index.db"
