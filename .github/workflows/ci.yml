name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The parity harness runs the Python implementation side by side with the
      # TypeScript one, so it needs python3 until the cutover removes it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: bun install --frozen-lockfile

      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --coverage
