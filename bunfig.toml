# Coverage is opt-in per run (`bun test --coverage`, as `bun run check` does) so a
# plain `bun test` stays fast.
#
# The threshold is a smoke alarm, not a target: it catches a module landing with no
# tests at all, and deliberately does not demand a number for every file. A high
# per-file bar pushes people into writing tests for plumbing — asserting that the
# clock returns a time, or that a test fake does what the fake obviously does — which
# costs maintenance and buys nothing.
#
# `gateways/`, `src/testing/`, `src/quality/` and `src/app/` are excluded because they are exactly
# that plumbing: thin adapters over Bun/node APIs, the fixtures and fakes the real
# tests are built from, the structural tests that assert on the repo's own shape,
# and the HTTP transport that is exercised through `memory serve` rather than unit tests.
#
# The four adapters that encode a real decision (FTS5 availability, git's
# non-zero exit, a missing binary, log rotation) are tested on purpose, not to satisfy
# a percentage.
#
# NOTE: Bun silently accepts unknown keys in this file, so a typo here enforces
# nothing at all. Every value below was verified by seeding a file that violates it
# and checking the exit code — do the same if you change any of them.
[test]
# LINES only. Function coverage is not a usable signal here: Bun counts a class's
# implicit constructor as an uncovered function, so a class with one method and no
# declared constructor reads 50% however well it is tested. Chasing that number
# produced empty `constructor() { void 0; }` bodies, which is worse than the metric.
#
# `functions = 0` is written explicitly on purpose: OMITTING a key from this object
# does not mean "don't check it", it means Bun applies a strict default and the run
# fails at 99.8% line coverage. Verified by trying it.
coverageThreshold = { lines = 0.6, functions = 0 }
coverageSkipTestFiles = true
coverageReporter = ["text"]
coveragePathIgnorePatterns = ["src/testing/**", "src/quality/**", "src/gateways/**", "src/app/**"]
